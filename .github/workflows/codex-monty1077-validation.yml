name: Monty 1077 exact source supplemental lint
run-name: Monty1077 ddc66fa9 lint source 057da5c2

on:
  push:
    branches: [codex-ci/monty1077-fe9dc4b2]

permissions:
  contents: read

jobs:
  supplemental-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      UV_PYTHON: '3.14.10'
      UV_FROZEN: '1'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: GoldArowana/monty
          ref: 057da5c2ee1e1bf25b18fa07aff9c8afb8a388c4
          path: source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.100.0'
      - run: rustup default 1.100.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14.10'
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          enable-cache: false
          version: '0.13.9'
      - name: Run exact candidate Python and Markdown lints
        run: bash harness/automation/monty1077/lint.sh
      - name: Always assert exact and clean candidate source
        if: always()
        run: bash harness/automation/monty1077/lint.sh --final-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: monty1077-ddc66fa9-lint-source057da5c2
          path: evidence-lint
          if-no-files-found: error
          retention-days: 7
